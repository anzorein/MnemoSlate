[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemoslate"
version = "0.1.0"
description = "Sistema distribuido de worldbuilding (bot + Pi + PC + repo de lore)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bot = ["python-telegram-bot>=21,<23", "python-dotenv>=1.0"]

# Comandos cortos (tras `pip install -e .`, sin PYTHONPATH ni `python -m`):
#   mnemoslate          -> bot de Telegram
#   mnemo-infra         -> red y energía de la PC (--encender/--apagar/...)
#   mnemo-sender        -> Fase 4 (--test/--procesar)
[project.scripts]
mnemoslate = "mnemoslate.bot:main"
mnemo-infra = "mnemoslate.infra.__main__:main"
mnemo-sender = "mnemoslate.sender:main_cli"

[tool.setuptools.packages.find]
where = ["src"]
